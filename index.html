        <p>Revolt. Freedom. Passion.</p>

    <div id="page-content">
      <figure class="quote">
        <blockquote class="poem">
          <p class="stanza">
            <span class="line">A man is born gentle and weak.</span>
            <span class="line">At his death he is hard and stiff.</span>
            <span class="line">Green plants are tender and filled with sap.</span>
            <span class="line">At their death they are withered and dry.</span>
          </p>
          <p class="stanza">
            <span class="line">Therefore the stiff and unbending is the disciple of death.</span>
            <span class="line">The gentle and yielding is the disciple of life.</span>
          </p>
          <p class="stanza">
            <span class="line">Thus an army without flexibility never wins a battle.</span>
            <span class="line">A tree that is unbending is easily broken.</span>
          </p>
          <p class="stanza">
            <span class="line">The hard and strong will fall.</span>
            <span class="line">The soft and weak will overcome.</span>
          </p>
        </blockquote>
        <figcaption class="citation">
          <p>Lao Tzu, <cite>Tao Te Ching</cite> 76, translated by Gia-Fu Feng (1972)</p>
        </figcaption>
      </figure>
